name: drive-permissions


x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-do-not-use-in-prod}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  POSTGRES_DB: ${POSTGRES_DB:-drive_permissions}
  POSTGRES_USER: ${POSTGRES_USER:-drive}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drive-dev-only-password}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  FERNET_KEY: ${FERNET_KEY:-IbpUmbO3FeXcPyMbR8bbVda3nRtWpCIS9wieaz4TX0E=}
  FERNET_KEYS: ${FERNET_KEYS:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/admin/credentials/oauth/callback}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
  DRIVE_GATEWAY_PROVIDER: ${DRIVE_GATEWAY_PROVIDER-apps.infrastructure.drive.fake.default_fake_gateway}
  DRIVE_FAKE_SEED_FILES: ${DRIVE_FAKE_SEED_FILES:-True}
  DRIVE_UPLOAD_MAX_BYTES: ${DRIVE_UPLOAD_MAX_BYTES:-26214400}
  DRIVE_UPLOAD_ALLOWED_MIME_TYPES: ${DRIVE_UPLOAD_ALLOWED_MIME_TYPES:-}
  LOGIN_THROTTLE_RATE: ${LOGIN_THROTTLE_RATE:-10/min}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drive_permissions}
      POSTGRES_USER: ${POSTGRES_USER:-drive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drive-dev-only-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  test:
    build: ./backend
    profiles: ["test"]
    environment: *backend-env
    command: pytest
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
