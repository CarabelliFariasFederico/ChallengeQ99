[tool.ruff]
line-length = 99
target-version = "py312"
exclude = ["apps/domain/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"apps/infrastructure/apps.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
